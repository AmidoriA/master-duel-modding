  restore_of_confirm_title: "Restore overframes after patch"
  restore_of_confirm: "Re-apply modded over-frames after an MD patch for {0} card(s) recorded in user.db.\n\nThis merges into the current of_card_asset gate (official OF entries are kept) and restores 704x1024 art from *-applied-overframe.png backups when live art was reset.\n\nQuit Master Duel first. Continue?"
  restore_of_starting: "Restoring modded over-frames after patch…"
  restore_of_failed: "Restore overframes failed: {0}"
  orphan_confirm_title: "Slower full fix with asset scans"
  orphan_confirm: "Slower full fix with asset scans\n\nThis opens live card AssetBundles looking for 704x1024 textures the app already renders as over-frame, then writes missing user.db OF records and adds missing of_card_asset gate entries (official entries kept). Art is not rewritten.\n\nThis is slower than Restore overframes after patch. Quit Master Duel first. Continue?"
