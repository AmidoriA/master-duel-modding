tools:
  card_database: "Card database"
  card_database_help: "Rebuild or incrementally refresh the master card catalog (database.db) from the Home LocalData path plus install StreamingAssets/AssetBundle (names, descriptions, bundles, card_type, created_at). Prefer LocalData downloads when both exist. Incremental mode skips illustration AssetBundles whose File.GetCreationTimeUtc is not after MAX(created_at) already stored in the database; CARD_* name/desc/prop bundles are still opened (MD patches often overwrite them without refreshing CreationTime)."
  update_entire_db: "Update entire DB"
  update_new_files: "Update new files only"
  update_new_files_tooltip: "Only open illustration AssetBundles whose File.GetCreationTimeUtc is after the latest created_at in database.db. CARD_* TextAsset bundles are still read so new art can be joined to names/types."
  of_gate: "of_card_asset gate"
  of_gate_help: "Resolve of_card_asset from the cached bundle id or the known live default, then optionally sync is_overframe flags. A full LocalData/StreamingAssets search only runs after you confirm — it is never started automatically on tab open."
  scan_of_card: "Scan / locate of_card_asset…"
  scan_of_card_tooltip: "Try the cached/default gate id first; if missing, ask before scanning LocalData for of_card_asset, then sync Over-frame flags."
  scan_of_card_confirm_title: "Scan for of_card_asset?"
  scan_of_card_confirm: "Could not open of_card_asset at the cached id or the known default '{0}'.\n\nSearch LocalData/0000 and StreamingAssets for the gate bundle? This can take a while and opens many AssetBundles.\n\nContinue?"
  of_after_patch: "Over-frames after patch"
  of_after_patch_help: "After a Master Duel update replaces of_card_asset, modded over-frames can drop out of the gate even when art backups remain. Restore uses user.db Floowan OF history (faster). The slower full fix scans live art AssetBundles for 704x1024 textures the app already renders as over-frame, writes missing user.db OF records, and adds missing of_card_asset entries without wiping official Konami over-frames."
  restore_overframes: "Restore overframes after patch"
  restore_overframes_tooltip: "Scan user.db for previously applied over-frames, merge each art id into the current of_card_asset gate (additive — official OF entries are kept), and re-apply 704x1024 art from backups/cards/*-applied-overframe.png when live texture was reset. Skips cards that are already gated with OF-sized art. Does not restore the whole gate backup file."
  orphan_fix: "Slower full fix with asset scans"
  orphan_fix_tooltip: "Slower full repair: open live card AssetBundles, find 704x1024 textures rendered as over-frame but missing/incomplete in user.db, save OF records the same way Apply does, and add missing of_card_asset gate entries (additive). Does not rewrite card art. Official Konami OF rows already in the gate are left alone unless Floowan evidence exists."
  onnx_models: "ONNX models"
  onnx_help: "First-use downloads for rembg (isnet-anime), Real-ESRGAN upscale, and SAM 2 live under %LOCALAPPDATA%\\Floowan\\models\\. Open the folder to inspect or free disk space."
  open_models: "Open models directory"
  open_models_tooltip: "Opens %LOCALAPPDATA%\\Floowan\\models\\ in Explorer (creates it if missing)."
  opened_path: "Opened: {0}"
  backups: "Backups"
  backups_help: "Browse original files saved before card art and over-frame changes."
  backup_folder: "Backup folder"
  open_explorer: "Open in Explorer"
  open_selected: "Open selected"
  backup_missing_folder: "Backup folder does not exist."
  backup_empty: "Backup folder is empty."
  backup_showing: "Showing {0} folder(s), {1} file(s) at root."
  update_db_starting_full: "Updating entire card database from game…"
  update_db_starting_incr: "Updating new catalog files from game…"
  update_db_failed: "Database update failed: {0}"
  update_db_detail: "{0} Scanned {1} bundles, {2} illustrations{3}"
  update_db_crypto: ", crypto key 0x{0:X}."
  update_entire_confirm_title: "Update entire DB"
  update_entire_confirm: "Replace the entire master card catalog in:\n{0}\n\nwith data extracted from:\n{1}\n\nUser favorites/mods in user.db are kept. Continue?"
  update_new_confirm_title: "Update new files only"
  update_new_confirm: "Upsert only cards from illustration AssetBundles whose File.GetCreationTimeUtc is after the latest created_at in:\n{0}\n\nLatest DB created_at: {1}\nOlder illustration files are skipped; CARD_* name/desc/prop bundles are still read.\nGame path:\n{2}\n\nExisting catalog rows are kept. User favorites/mods in user.db are kept. Continue?"
