tools:
  card_database: "ฐานข้อมูลการ์ด"
  card_database_help: "สร้างใหม่หรืออัปเดตแบบเพิ่มทีละส่วนแคตตาล็อกการ์ดหลัก (database.db) จากพาธ LocalData ที่หน้าหลัก รวมถึง StreamingAssets/AssetBundle ของการติดตั้ง (ชื่อ คำอธิบาย บันเดิล card_type created_at) ให้ความสำคัญกับดาวน์โหลดใน LocalData เมื่อมีทั้งคู่ โหมดเพิ่มทีละส่วนจะข้าม AssetBundle ที่ File.GetCreationTimeUtc ไม่ใหม่กว่า MAX(created_at) ในฐานข้อมูล — ไฟล์เหล่านั้นจะไม่ถูกเปิด"
  update_entire_db: "อัปเดตฐานข้อมูลทั้งหมด"
  update_new_files: "อัปเดตเฉพาะไฟล์ใหม่"
  update_new_files_tooltip: "เปิดเฉพาะ AssetBundle ที่ File.GetCreationTimeUtc ใหม่กว่า created_at ล่าสุดใน database.db ไฟล์เก่าจะถูกข้ามทั้งหมด"
  of_gate: "เกต of_card_asset"
  of_gate_help: "ค้นหา AssetBundle ที่มี TextAsset of_card_asset ภายใต้ LocalData/0000 และ StreamingAssets แคช id ไว้ใน user.db และซิงก์แฟล็ก is_overframe จากเกตสด ทำงานนอกเธรด UI เพื่อให้แอปตอบสนองระหว่างสแกน"
  scan_of_card: "สแกน / ค้นหา of_card_asset…"
  scan_of_card_tooltip: "ค้นหา of_card_asset แคช bundle id และซิงก์แฟล็กโอเวอร์เฟรมจากเกต งานไฟล์/AssetBundle ที่นานทำงานพื้นหลัง"
  of_after_patch: "โอเวอร์เฟรมหลังแพตช์"
  of_after_patch_help: "หลังอัปเดต Master Duel ที่แทนที่ of_card_asset โอเวอร์เฟรมที่มอดไว้สามารถหลุดจากเกตได้แม้ยังมีแบ็กอัพอาร์ต กู้คืนใช้ประวัติ OF ของ Floowan ใน user.db (เร็วกว่า) การแก้แบบเต็มที่ช้ากว่าจะสแกน AssetBundle อาร์ตสดหาเท็กซ์เจอร์ 704x1024 ที่แอปแสดงเป็นโอเวอร์เฟรมแล้ว เขียนเรคคอร์ด OF ที่ขาดใน user.db และเพิ่มรายการ of_card_asset ที่ขาดโดยไม่ลบโอเวอร์เฟรมทางการของ Konami"
  restore_overframes: "กู้คืนโอเวอร์เฟรมหลังแพตช์"
  restore_overframes_tooltip: "สแกน user.db หาโอเวอร์เฟรมที่เคยนำไปใช้ รวมแต่ละ art id เข้าเกต of_card_asset ปัจจุบัน (เพิ่มอย่างเดียว — คงรายการ OF ทางการ) และใส่คืนอาร์ต 704x1024 จาก backups/cards/*-applied-overframe.png เมื่อเท็กซ์เจอร์สดถูกรีเซ็ต ข้ามการ์ดที่อยู่ในเกตและมีอาร์ตขนาด OF แล้ว ไม่กู้คืนไฟล์แบ็กอัพเกตทั้งก้อน"
  orphan_fix: "แก้แบบเต็มด้วยการสแกนแอสเซ็ต (ช้ากว่า)"
  orphan_fix_tooltip: "ซ่อมแบบเต็มที่ช้ากว่า: เปิด AssetBundle การ์ดสด หาเท็กซ์เจอร์ 704x1024 ที่แสดงเป็นโอเวอร์เฟรมแต่ขาด/ไม่ครบใน user.db บันทึกเรคคอร์ด OF แบบเดียวกับ Apply และเพิ่มรายการเกต of_card_asset ที่ขาด (เพิ่มอย่างเดียว) ไม่เขียนอาร์ตการ์ดใหม่ แถว OF ของ Konami ในเกตจะไม่ถูกรบกวนเว้นแต่มีหลักฐานของ Floowan"
